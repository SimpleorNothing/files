<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>파일 보관함</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --border: #e3e6ea;
    --text: #1b1f24;
    --muted: #6b727c;
    --accent: #2f6fed;
    --accent-hover: #2560d8;
    --danger: #d23b32;
    --ok: #1f9d3b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #f6f8fc 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }

  /* ---------- 로그인 ---------- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 10px 40px rgba(0,0,0,.08);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .field { position: relative; }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 13px 14px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600;
    cursor: pointer; color: #fff; background: var(--accent); transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-block { width: 100%; margin-top: 16px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { background: var(--panel-2); }
  .btn-sm { padding: 7px 11px; font-size: 13px; }
  .btn-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); }
  .btn-danger:hover { background: rgba(229,83,75,.12); }
  .error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 16px; }

  /* ---------- 앱 ---------- */
  .app { display: none; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
  }
  header.top h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }

  .tabs { display: inline-flex; gap: 4px; margin-bottom: 16px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  .tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 7px; cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tab .tcount { color: var(--muted); font-weight: 500; font-size: 12px; }
  .tab.active .tcount { color: var(--accent); }
  td.cat, th.cat-h { white-space: nowrap; }
  .cat-badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); }
  .cat-badge.cat-company { color: var(--accent); background: rgba(47,111,237,.10); border-color: rgba(47,111,237,.25); }
  .cat-badge.cat-personal { color: var(--ok); background: rgba(31,157,59,.10); border-color: rgba(31,157,59,.25); }
  .cat-badge.cat-none { color: var(--muted); background: var(--panel-2); }

  .dropzone {
    border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 30px 20px;
    text-align: center; color: var(--muted); cursor: pointer; transition: all .15s; background: #fbfcfd;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--text); background: rgba(79,134,247,.08); }
  .dropzone strong { color: var(--text); }
  .dropzone .hint { font-size: 12.5px; margin-top: 6px; }

  .uploads { margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .uprow { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .uprow .name { display: flex; justify-content: space-between; gap: 10px; }
  .uprow .name .pct { color: var(--muted); }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s; }
  .uprow.err { border-color: var(--danger); }
  .uprow.err .pct { color: var(--danger); }

  .list { margin-top: 24px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .list-head-left { display: flex; align-items: center; gap: 8px; }
  .list-head .count { color: var(--muted); font-size: 13px; }
  .search { flex: 0 1 240px; min-width: 150px; padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
  .search:focus { border-color: var(--accent); background: #fff; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th .arrow { margin-left: 4px; color: var(--accent); font-size: 10px; }

  .selbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  .selbar .selcount { font-size: 13px; color: var(--muted); font-weight: 600; }
  th.chk, td.chk { width: 1%; white-space: nowrap; padding-right: 0; }
  input[type="checkbox"] { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent); vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: none; }
  tr:last-child td { border-bottom: 0; }
  td.size, th.size { white-space: nowrap; color: var(--muted); }
  td.date, th.date { white-space: nowrap; color: var(--muted); }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions a, td.actions button { margin-left: 6px; vertical-align: middle; }
  .fname { word-break: break-all; }
  a.fname-link { color: var(--text); text-decoration: none; font-weight: 600; cursor: pointer; }
  a.fname-link:hover { color: var(--accent); text-decoration: underline; }
  a.dl { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
  a.dl:hover { text-decoration: underline; }
  .empty, .loading { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color: var(--accent); border-radius:50%; animation: sp .7s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    th.date, td.date { display: none; }
  }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login" class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>파일 보관함</h1>
    <p>접속하려면 비밀번호를 입력하세요.</p>
    <div class="field">
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus />
    </div>
    <button id="loginBtn" class="btn btn-block" type="submit">입장</button>
    <div id="loginErr" class="error"></div>
  </form>
</div>

<!-- 앱 화면 -->
<div id="app" class="app">
  <div class="wrap">
    <header class="top">
      <h1><span class="dot"></span> 파일 보관함</h1>
      <button id="logoutBtn" class="btn btn-ghost btn-sm" type="button">로그아웃</button>
    </header>

    <div class="tabs">
      <button class="tab active" type="button" data-cat="all">전체 <span id="tc-all" class="tcount"></span></button>
      <button class="tab" type="button" data-cat="company">회사 <span id="tc-company" class="tcount"></span></button>
      <button class="tab" type="button" data-cat="personal">개인 <span id="tc-personal" class="tcount"></span></button>
    </div>

    <div id="dropzone" class="dropzone">
      <strong>파일을 끌어다 놓거나 클릭</strong>해서 업로드
      <div class="hint" id="dzHint">제목·내용을 분석해 회사/개인 자동 분류 · 애매하면 미분류</div>
      <input id="fileInput" type="file" multiple hidden />
    </div>

    <div id="uploads" class="uploads"></div>

    <div class="list">
      <div class="list-head">
        <div class="list-head-left">
          <span>파일 목록</span>
          <span id="count" class="count"></span>
        </div>
        <input id="search" type="search" class="search" placeholder="파일 이름 검색…" autocomplete="off" />
      </div>
      <div id="selbar" class="selbar">
        <span id="selcount" class="selcount">0개 선택됨</span>
        <button id="selDownload" class="btn btn-ghost btn-sm" type="button" disabled>선택 다운로드</button>
        <button id="selDelete" class="btn btn-danger btn-sm" type="button" disabled>선택 삭제</button>
      </div>
      <div id="listBody">
        <div class="loading"><span class="spin"></span>불러오는 중…</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "/files/api";

const $ = (id) => document.getElementById(id);
const loginView = $("login");
const appView = $("app");

async function api(path, opts = {}) {
  return fetch(API + path, { credentials: "same-origin", ...opts });
}

/* ---------- 인증 ---------- */
async function checkSession() {
  try {
    const r = await api("/session");
    const d = await r.json();
    if (d.authenticated) showApp();
    else showLogin();
  } catch {
    showLogin();
  }
}

function showLogin() {
  appView.style.display = "none";
  loginView.style.display = "flex";
  $("pw").focus();
}

function showApp() {
  loginView.style.display = "none";
  appView.style.display = "block";
  loadFiles();
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginBtn");
  const err = $("loginErr");
  err.textContent = "";
  btn.disabled = true;
  try {
    const r = await api("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value }),
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      $("pw").value = "";
      showApp();
    } else {
      err.textContent = d.error || "로그인에 실패했습니다.";
    }
  } catch {
    err.textContent = "네트워크 오류가 발생했습니다.";
  } finally {
    btn.disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  await api("/logout", { method: "POST" });
  showLogin();
});

/* ---------- 목록 ---------- */
let allFiles = [];
let activeCat = "all";
let currentFiles = [];
const selected = new Set();
const sortState = { key: "uploaded", dir: "desc" };
const CAT = {
  company: { prefix: "company/", label: "회사" },
  personal: { prefix: "personal/", label: "개인" },
};
function catOf(key) {
  if (key.startsWith(CAT.company.prefix)) return "company";
  if (key.startsWith(CAT.personal.prefix)) return "personal";
  return "none";
}
function displayName(key) {
  const c = catOf(key);
  return c === "none" ? key : key.slice(CAT[c].prefix.length);
}
function targetKey(name) {
  // 전체 탭: 접두사 없이 올리면 서버가 제목+내용으로 자동 분류. 회사/개인 탭: 명시 지정.
  return activeCat === "all" ? name : CAT[activeCat].prefix + name;
}

async function loadFiles() {
  const body = $("listBody");
  body.innerHTML = '<div class="loading"><span class="spin"></span>불러오는 중…</div>';
  try {
    const r = await api("/list");
    if (r.status === 401) return showLogin();
    const d = await r.json();
    if (!d.ok) {
      body.innerHTML = '<div class="empty">' + esc(d.error || "목록을 불러오지 못했습니다.") + "</div>";
      $("count").textContent = "";
      return;
    }
    allFiles = d.files;
    const keys = new Set(allFiles.map((f) => f.key));
    for (const k of [...selected]) if (!keys.has(k)) selected.delete(k);
    render();
  } catch {
    body.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
  }
}

function render() {
  updateTabCounts();
  const inCat = activeCat === "all" ? allFiles : allFiles.filter((f) => catOf(f.key) === activeCat);
  const q = ($("search").value || "").trim().toLowerCase();
  let files = q ? inCat.filter((f) => displayName(f.key).toLowerCase().includes(q)) : inCat.slice();
  files = sortFiles(files);

  $("count").textContent = !inCat.length ? "" : q ? files.length + " / " + inCat.length + "개" : inCat.length + "개";
  currentFiles = files;
  updateSelBar();

  const body = $("listBody");
  if (!allFiles.length) {
    body.innerHTML = '<div class="empty">아직 업로드된 파일이 없습니다.</div>';
    return;
  }
  if (!inCat.length) {
    body.innerHTML = '<div class="empty">이 분류에 파일이 없습니다.</div>';
    return;
  }
  if (!files.length) {
    body.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }

  const table = document.createElement("table");
  table.appendChild(buildHead());
  const tbody = document.createElement("tbody");
  for (const f of files) tbody.appendChild(buildRow(f));
  table.appendChild(tbody);
  body.innerHTML = "";
  body.appendChild(table);
}

function updateTabCounts() {
  let c = 0, p = 0;
  for (const f of allFiles) {
    const k = catOf(f.key);
    if (k === "company") c++;
    else if (k === "personal") p++;
  }
  $("tc-all").textContent = allFiles.length ? "(" + allFiles.length + ")" : "";
  $("tc-company").textContent = c ? "(" + c + ")" : "";
  $("tc-personal").textContent = p ? "(" + p + ")" : "";
}

function sortFiles(files) {
  const { key, dir } = sortState;
  const mul = dir === "asc" ? 1 : -1;
  const byName = (a, b) => displayName(a.key).localeCompare(displayName(b.key), "ko", { numeric: true, sensitivity: "base" });
  const catRank = { company: 0, personal: 1, none: 2 };
  return files.sort((a, b) => {
    let r;
    if (key === "size") r = a.size - b.size;
    else if (key === "uploaded") r = new Date(a.uploaded) - new Date(b.uploaded);
    else if (key === "cat") r = catRank[catOf(a.key)] - catRank[catOf(b.key)];
    else r = byName(a, b);
    if (r === 0) r = byName(a, b);
    return r * mul;
  });
}

function buildHead() {
  const cols = [
    { key: "key", label: "이름", cls: "" },
    { key: "size", label: "크기", cls: "size" },
    { key: "uploaded", label: "업로드", cls: "date" },
  ];
  const thead = document.createElement("thead");
  const tr = document.createElement("tr");

  const thChk = document.createElement("th");
  thChk.className = "chk";
  const all = document.createElement("input");
  all.type = "checkbox";
  all.id = "selectAll";
  const vis = currentFiles.length;
  const selVis = currentFiles.filter((f) => selected.has(f.key)).length;
  all.checked = vis > 0 && selVis === vis;
  all.indeterminate = selVis > 0 && selVis < vis;
  all.addEventListener("change", () => {
    if (all.checked) currentFiles.forEach((f) => selected.add(f.key));
    else currentFiles.forEach((f) => selected.delete(f.key));
    render();
  });
  thChk.appendChild(all);
  tr.appendChild(thChk);

  for (const c of cols) {
    const th = document.createElement("th");
    th.className = (c.cls ? c.cls + " " : "") + "sortable";
    th.textContent = c.label;
    if (sortState.key === c.key) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = sortState.dir === "asc" ? "▲" : "▼";
      th.appendChild(arrow);
    }
    th.addEventListener("click", () => toggleSort(c.key));
    tr.appendChild(th);
  }
  const thCat = document.createElement("th");
  thCat.className = "cat-h sortable";
  thCat.textContent = "분류";
  if (sortState.key === "cat") {
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = sortState.dir === "asc" ? "▲" : "▼";
    thCat.appendChild(arrow);
  }
  thCat.addEventListener("click", () => toggleSort("cat"));
  tr.appendChild(thCat);
  tr.appendChild(document.createElement("th"));
  thead.appendChild(tr);
  return thead;
}

function toggleSort(key) {
  if (sortState.key === key) {
    sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
  } else {
    sortState.key = key;
    sortState.dir = key === "size" || key === "uploaded" ? "desc" : "asc"; // 크기/날짜는 내림차순, 이름/분류는 오름차순 기본
  }
  render();
}

function buildRow(f) {
  const tr = document.createElement("tr");

  const tdChk = document.createElement("td");
  tdChk.className = "chk";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = selected.has(f.key);
  cb.addEventListener("change", () => {
    if (cb.checked) selected.add(f.key);
    else selected.delete(f.key);
    const all = $("selectAll");
    if (all) {
      const vis = currentFiles.length;
      const selVis = currentFiles.filter((x) => selected.has(x.key)).length;
      all.checked = vis > 0 && selVis === vis;
      all.indeterminate = selVis > 0 && selVis < vis;
    }
    updateSelBar();
  });
  tdChk.appendChild(cb);
  tr.appendChild(tdChk);

  const tdName = document.createElement("td");
  tdName.className = "fname";
  const open = document.createElement("a");
  open.className = "fname-link";
  open.textContent = displayName(f.key);
  open.href = API + "/file/" + encodeURIComponent(f.key) + "?inline=1";
  open.target = "_blank";
  open.rel = "noopener";
  tdName.appendChild(open);
  tr.appendChild(tdName);

  const tdSize = document.createElement("td");
  tdSize.className = "size";
  tdSize.textContent = fmtSize(f.size);
  tr.appendChild(tdSize);

  const tdDate = document.createElement("td");
  tdDate.className = "date";
  tdDate.textContent = fmtDate(f.uploaded);
  tr.appendChild(tdDate);

  const tdCat = document.createElement("td");
  tdCat.className = "cat";
  const c = catOf(f.key);
  const badge = document.createElement("span");
  badge.className = "cat-badge cat-" + c;
  badge.textContent = { company: "회사", personal: "개인", none: "미분류" }[c];
  tdCat.appendChild(badge);
  tr.appendChild(tdCat);

  const tdAct = document.createElement("td");
  tdAct.className = "actions";
  const dl = document.createElement("a");
  dl.className = "dl";
  dl.textContent = "다운로드";
  dl.href = API + "/file/" + encodeURIComponent(f.key);
  dl.setAttribute("download", displayName(f.key));
  tdAct.appendChild(dl);

  const del = document.createElement("button");
  del.className = "btn btn-danger btn-sm";
  del.textContent = "삭제";
  del.addEventListener("click", () => removeFile(f.key));
  tdAct.appendChild(del);

  tr.appendChild(tdAct);
  return tr;
}

$("search").addEventListener("input", render);

function updateSelBar() {
  const n = selected.size;
  $("selcount").textContent = n + "개 선택됨";
  $("selDownload").disabled = n === 0;
  $("selDelete").disabled = n === 0;
}

$("selDownload").addEventListener("click", async () => {
  const keys = [...selected];
  for (const key of keys) {
    const a = document.createElement("a");
    a.href = API + "/file/" + encodeURIComponent(key);
    a.download = displayName(key);
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise((r) => setTimeout(r, 400));
  }
});

$("selDelete").addEventListener("click", async () => {
  const keys = [...selected];
  if (!keys.length) return;
  if (!confirm("선택한 " + keys.length + "개 파일을 삭제할까요?")) return;
  const btn = $("selDelete");
  btn.disabled = true;
  for (const key of keys) {
    const r = await api("/file/" + encodeURIComponent(key), { method: "DELETE" });
    if (r.status === 401) return showLogin();
    selected.delete(key);
  }
  loadFiles();
});

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    activeCat = btn.dataset.cat;
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
    selected.clear();
    updateDropzoneHint();
    render();
  });
});

function updateDropzoneHint() {
  const h = $("dzHint");
  if (activeCat === "company") h.textContent = "‘회사’에 업로드됩니다 · 여러 파일 가능";
  else if (activeCat === "personal") h.textContent = "‘개인’에 업로드됩니다 · 여러 파일 가능";
  else h.textContent = "제목·내용을 분석해 회사/개인 자동 분류 · 애매하면 미분류";
}

async function removeFile(key) {
  if (!confirm('"' + displayName(key) + '" 파일을 삭제할까요?')) return;
  const r = await api("/file/" + encodeURIComponent(key), { method: "DELETE" });
  if (r.status === 401) return showLogin();
  loadFiles();
}

/* ---------- 업로드 ---------- */
const dz = $("dropzone");
const fileInput = $("fileInput");

dz.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  uploadFiles([...fileInput.files]);
  fileInput.value = "";
});
["dragenter", "dragover"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("drag"); })
);
["dragleave", "drop"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("drag"); })
);
dz.addEventListener("drop", (e) => {
  if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]);
});

function uploadFiles(files) {
  files.forEach(uploadOne);
}

function uploadOne(file) {
  const row = document.createElement("div");
  row.className = "uprow";
  const head = document.createElement("div");
  head.className = "name";
  const nm = document.createElement("span");
  nm.textContent = file.name;
  const pct = document.createElement("span");
  pct.className = "pct";
  pct.textContent = "0%";
  head.appendChild(nm);
  head.appendChild(pct);
  const bar = document.createElement("div");
  bar.className = "bar";
  const fill = document.createElement("i");
  bar.appendChild(fill);
  row.appendChild(head);
  row.appendChild(bar);
  $("uploads").prepend(row);

  const xhr = new XMLHttpRequest();
  xhr.open("PUT", API + "/file/" + encodeURIComponent(targetKey(file.name)));
  xhr.withCredentials = true;
  if (file.type) xhr.setRequestHeader("Content-Type", file.type);

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const p = Math.round((e.loaded / e.total) * 100);
      fill.style.width = p + "%";
      pct.textContent = p + "%";
    }
  };
  xhr.onload = () => {
    if (xhr.status === 401) { showLogin(); return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      pct.textContent = "완료";
      fill.style.width = "100%";
      setTimeout(() => row.remove(), 1200);
      loadFiles();
    } else {
      row.classList.add("err");
      pct.textContent = "실패 (" + xhr.status + ")";
    }
  };
  xhr.onerror = () => {
    row.classList.add("err");
    pct.textContent = "네트워크 오류";
  };
  xhr.send(file);
}

/* ---------- 유틸 ---------- */
function fmtSize(n) {
  if (n === 0) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.floor(Math.log(n) / Math.log(1024));
  return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i];
}
function fmtDate(s) {
  const d = new Date(s);
  if (isNaN(d)) return "";
  const p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
